<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AI Job Assistant{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
    <header class="app-header">
        <div class="header-container">
            <div class="brand">
                <span class="brand-icon">⚡</span>
                <span class="brand-name">AI Job Assistant</span>
                <span class="badge badge-subtle">Antigravity</span>
            </div>
            <nav class="nav-links">
                <a href="{{ url_for('profile_view') }}" class="nav-link {% if active_page == 'profile' %}active{% endif %}">
                    <span class="icon">👤</span> My Profile
                </a>
                <a href="{{ url_for('jobs_view') }}" class="nav-link {% if active_page == 'jobs' %}active{% endif %}">
                    <span class="icon">💼</span> Jobs
                </a>
                <a href="{{ url_for('agent_view') }}" class="nav-link {% if active_page == 'agent' %}active{% endif %}">
                    <span class="icon">🤖</span> Agent
                </a>
                <a href="{{ url_for('settings_view') }}" class="nav-link {% if active_page == 'settings' %}active{% endif %}">
                    <span class="icon">⚙️</span> Settings
                </a>
            </nav>
            <div class="header-status">
                <span class="status-indicator online"></span>
                <span class="status-text">Safe Dry-Run Active</span>
            </div>
        </div>
    </header>

    <main class="main-content">
        <div class="content-container">
            {% block content %}{% endblock %}
        </div>
    </main>

    <footer class="app-footer">
        <div class="footer-container">
            <span>AI Job Search Framework • Thin Web Interface over Google Antigravity Agent</span>
            <span>Source of Truth: <code>.claude/skills/job-application-assistant/</code></span>
        </div>
    </footer>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
